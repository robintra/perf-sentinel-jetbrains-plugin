# Lint configuration for the repository's own Python tooling (scripts/, tools/).
# The plugin ships no Python: Qodana JVM covers Kotlin and Qodana .NET covers C#,
# neither of them looks at these files, so ruff is their only automated gate.

target-version = "py311"

[lint]
select = ["E", "W", "F", "B", "C4", "SIM", "UP", "RET", "ARG", "PTH", "RUF"]

# E501: the validators carry long literal tables (up to 369 characters) on purpose,
#       wrapping them would hurt more than the width does.
# SIM905: REQUIRED_ACTIONS and its siblings are written as a whitespace-separated
#         block because a compact list of names reads better than 18 quoted strings.
ignore = ["E501", "SIM905"]
