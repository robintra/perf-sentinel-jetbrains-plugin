name: Renovate

# Self-hosted Renovate. It runs from main only and never on a pull request, so no
# proposed change can reach the App key the renovate environment holds. Renovate
# pushes with the App token, which lets CI run on its branches; the sync hook only
# reads public release data and gets the read-only workflow token instead.

on:
  schedule:
    # The only schedule: renovate.json carries no window of its own, because GitHub starts
    # this repository's crons hours late and a window would make every scheduled run a no-op.
    - cron: '17 5 * * *'
  workflow_dispatch:

# Read-only: the hook only reads public release metadata; Renovate writes with the App token.
permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Propose dependency updates
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: renovate
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with: {egress-policy: audit}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          # Scoped explicitly so the token stops inheriting the App's blanket installation
          # permissions. Only checks and metadata stay at read:
          #   contents        writes to push branches and merge matured pull requests
          #   pull-requests   writes to open and update them
          #   issues          writes because the dependency dashboard issue is enabled
          #   statuses        writes because Renovate POSTs the renovate/stability-days
          #                   pending check itself (setStability -> POST
          #                   .../statuses/{sha}); without it that call throws,
          #                   Renovate turns it into REPOSITORY_CHANGED, and the whole
          #                   run aborts
          #   workflows       writes because several managers target .github/workflows/,
          #                   and GitHub refuses any push touching a workflow file without it
          permission-checks: read
          permission-contents: write
          permission-issues: write
          permission-metadata: read
          permission-pull-requests: write
          permission-statuses: write
          permission-workflows: write
      - uses: renovatebot/github-action@9fea9f0fbf80401026d11d03911d62b1f70fef1f
        env:
          RENOVATE_CUSTOM_ENV_VARIABLES: '{"GITHUB_TOKEN": "${{ github.token }}"}'
        with:
          configurationFile: .github/renovate-global.json
          token: ${{ steps.app-token.outputs.token }}
          renovate-image: renovate/renovate
          renovate-version: 44.132.2@sha256:0191afbc3937e5316263426fc0ce1450f5c143d42e3f91da8c6f771e317fae51
