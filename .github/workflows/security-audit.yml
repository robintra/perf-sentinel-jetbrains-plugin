name: Security Audit

on:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [main]

permissions: {}

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  osv:
    name: OSV dependency audit
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      # The config does not propagate to child directories, and the manifests sit in three of them,
      # so it is passed explicitly rather than copied around.
      scan-args: |-
        --config=osv-scanner.toml
        --recursive
        ./
      results-file-name: osv.sarif
      fail-on-vuln: true

  dependencies:
    name: Dependencies and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with: {egress-policy: audit}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with: {distribution: temurin, java-version-file: .java-version}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with: {dotnet-version: 10.0.302}
      - run: scripts/free-hosted-runner-space.sh
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        # Restoring the Gradle cache lands after the cleanup step above and refills the disk:
        # the cache now carries every pinned IDE archive and exhausted the runner without it.
        with: {gradle-version: "9.7.1", cache-read-only: true}
      - name: Validate immutable inputs and Gradle dependencies
        run: |
          mkdir -p build/security
          python3 scripts/check-supply-chain.py
          gradle --no-daemon --dependency-verification strict dependencies :protocol:dependencies :rider-frontend:dependencies --configuration runtimeClasspath
      # Qodana imports the build without running :protocol:rdgen. This job has already restored
      # the Rider SDK the generator needs, so it hands the generated Kotlin model to qodana-jvm.
      - run: gradle --no-daemon --dependency-verification strict :protocol:rdgen
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: rider-protocol-model, if-no-files-found: error, path: rider-frontend/build/generated/rd/kotlin}
      - name: Audit locked NuGet dependencies
        run: |
          dotnet restore src/dotnet/PerfSentinel.Rider/PerfSentinel.Rider.csproj --locked-mode --configfile src/dotnet/NuGet.Config -p:NuGetAudit=true -p:NuGetAuditMode=all -p:TreatWarningsAsErrors=true
          dotnet restore src/dotnet/PerfSentinel.Rider.Tests/PerfSentinel.Rider.Tests.csproj --locked-mode --configfile src/dotnet/NuGet.Config -p:NuGetAudit=true -p:NuGetAuditMode=all -p:TreatWarningsAsErrors=true
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: 8.30.1
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482
        with:
          version: 1.30.0
          collect: workflows
          online-audits: false
          advanced-security: false
          annotations: true
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          path: .
          format: spdx-json
          output-file: build/security/source.spdx.json
          artifact-name: plugin-source-sbom.spdx.json
          syft-version: v1.51.1
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false
      # The licence allowlist flag is deliberately absent. osv-scanner accepts only plain SPDX
      # identifiers, so the list could
      # not even express Apache-2.0 WITH LLVM-exception, which nine packages carry, and the step
      # exited before evaluating anything. Allowing every expressible value still leaves 213
      # packages that syft labels non-standard, a token the flag rejects: scanning a source
      # directory simply does not yield licence metadata for Maven, NuGet and Actions dependencies.
      # The SBOM is still scanned for vulnerabilities, under the same documented exceptions.
      - name: Enforce the SPDX package-source policy
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67
        with:
          scan-args: |-
            --config=osv-scanner.toml
            build/security/source.spdx.json
      # rider-frontend's test runtime resolves the root project as its composed jar, a file the
      # Qodana import never builds. It is built after the SBOM so syft does not catalog it, and
      # like the RD model it still reaches qodana-jvm when an audit step above has failed.
      - if: ${{ !cancelled() }}
        run: gradle --no-daemon --dependency-verification strict :composedJar
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: root-plugin-jar, if-no-files-found: error, path: build/libs}

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with: {egress-policy: audit}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: mkdir -p build/security
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc
        with:
          results_file: build/security/scorecard.sarif
          results_format: sarif
          repo_token: ${{ github.token }}
          publish_results: true
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          sarif_file: build/security/scorecard.sarif
          category: security-audit/scorecard

  qodana-jvm:
    name: Qodana JVM
    needs: dependencies
    # The model is uploaded before the audit steps, so their failures must not skip the scan.
    # A failure before the upload still fails the download below.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    env:
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {name: rider-protocol-model, path: rider-frontend/build/generated/rd/kotlin}
      - name: Require the generated RD model
        run: test -f rider-frontend/build/generated/rd/kotlin/PerfSentinelModel.Generated.kt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {name: root-plugin-jar, path: build/libs}
      - name: Require the composed plugin jar
        run: test -f "build/libs/perf-sentinel-jetbrains-plugin-$(sed -n 's/^version=//p' gradle.properties).jar"
      - uses: JetBrains/qodana-action@10be11607eb323a180e2b76b26c9c5cdceac3e77
        with:
          args: --config qodana.yml
          results-dir: build/security/qodana-jvm
          upload-result: false
          use-caches: false
          use-annotations: false
          post-pr-comment: false
          push-fixes: none
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          sarif_file: build/security/qodana-jvm/qodana.sarif.json
          category: qodana-jvm

  notify:
    name: Reconcile scheduled audit alert
    needs: [osv, dependencies, scorecard, qodana-jvm]
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          github-token: ${{ github.token }}
          script: |
            const needs = JSON.parse(process.env.NEEDS_JSON);
            const expected = ['dependencies', 'osv', 'qodana-jvm', 'scorecard'];
            if (Object.keys(needs).sort().join(',') !== expected.join(',')) throw new Error('audit results are incomplete');
            const failed = expected.filter(name => needs[name].result !== 'success');
            const title = '[Security Audit] scheduled failure';
            const all = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state: 'all', labels: 'security-audit', per_page: 100});
            const matches = all.filter(issue => !issue.pull_request && issue.title === title).sort((a, b) => a.number - b.number);
            if (!failed.length) {
              for (const issue of matches.filter(issue => issue.state === 'open')) await github.rest.issues.update({...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed'});
              return;
            }
            try {
              await github.rest.issues.getLabel({...context.repo, name: 'security-audit'});
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({...context.repo, name: 'security-audit', color: 'b60205', description: 'Automated security audit alert'});
            }
            const body = `Daily audit failed or was incomplete.\n\nJobs: ${failed.join(', ')}\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (!matches.length) await github.rest.issues.create({...context.repo, title, body, labels: ['security-audit']});
            else await github.rest.issues.update({...context.repo, issue_number: matches[0].number, body, labels: ['security-audit'], state: 'open'});
            for (const duplicate of matches.slice(1).filter(issue => issue.state === 'open')) await github.rest.issues.update({...context.repo, issue_number: duplicate.number, state: 'closed', state_reason: 'not_planned'});
