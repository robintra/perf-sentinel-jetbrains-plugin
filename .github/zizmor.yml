# Findings this repository accepts, with the reasoning that earned the exception.

rules:
  # zizmor asks for at least seven days before Dependabot proposes a release, as protection against
  # consuming a freshly compromised version before it is yanked. This repository takes updates
  # immediately instead, and check-dependency-automation.py actively forbids any delay key: every
  # bump is reviewed by a human, Gradle dependency verification pins every checksum, and the full
  # pipeline runs before anything merges, so a bad release is caught by the gate rather than by
  # waiting. Matches the same decision taken in PerfSentinelHub. Reviewed 2026-08-14.
  dependabot-cooldown:
    ignore:
      - dependabot.yml
