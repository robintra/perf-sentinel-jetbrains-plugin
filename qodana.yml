# Qodana configuration:
# https://www.jetbrains.com/help/qodana/qodana-yaml.html

version: "1.0"

linter: jetbrains/qodana-jvm-community:2026.1

profile:
  path: .qodana/profiles/plugin.yaml

exclude:
  - name: All
    paths:
      - .qodana
  # The Community image lacks optional product plugins; Plugin Verifier covers this file.
  - name: PluginXmlValidity
    paths:
      - src/main/resources/META-INF/plugin.xml
