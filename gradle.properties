group=io.github.robintra
version=0.1.0
marketplaceChannel=default
# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency=false
# RdGen retains Gradle project state, so this cache is discarded on every build.
org.gradle.configuration-cache=false
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
# Bounded retries for transient repository failures. Maven Central and the Gradle Plugin Portal
# both returned errors mid-run, and the defaults (3 attempts, 125 ms) gave up too fast.
# These properties are internal to Gradle and may be renamed in a future version.
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=1000
# The CodeQL job compiles under its tracer, which pushes the Kotlin daemon past its default heap
# and fails with "Not enough memory to run compilation". Hosted runners have 16 GB.
kotlin.daemon.jvmargs=-Xmx3g
